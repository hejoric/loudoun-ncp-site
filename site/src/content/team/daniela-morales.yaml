branch: gmu
bio: >-
  Growing up in Loudoun County and attending Potomac Falls High School, Daniela
  developed a strong appreciation for the natural spaces and ecosystems
  throughout Northern Virginia. Now a junior studying Environmental Science at
  George Mason University, she serves as President of the George Mason
  University branch of the Loudoun Nature Conservation Project. She also works
  at Claude Moore Park, where she helps educate children about the environment
  and encourages them to engage with the natural world around them. Through
  LNCP, Daniela works to connect Mason students with hands-on conservation
  opportunities, local environmental organizations, and their surrounding
  communities. She hopes to help people develop a stronger connection with their
  environment by creating opportunities to explore, learn about, and actively
  care for the natural spaces around them.
