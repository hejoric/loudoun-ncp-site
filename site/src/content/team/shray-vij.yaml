bio: >-
  Shray joined LNCP in early 2024 and has since led several of the
  organization’s research initiatives, guiding projects from concept to
  publication. His work spans LNCP’s water quality studies, including its water
  factors, runoff, and nitrate research, along with a study on the environmental
  impact of data center growth across Northern Virginia. As a Research
  Associate, he focuses on applying rigorous science to real-world
  conservation challenges and using LNCP’s findings to inform local
  decision-making and broader environmental advocacy.


  His contributions have helped bring LNCP’s research to a wider audience,
  including a featured segment on WUSA9 and recognition in the Congressional
  Record by U.S. Representative Suhas Subramanyam. Outside of LNCP, Shray spends
  his free time at the gym.
