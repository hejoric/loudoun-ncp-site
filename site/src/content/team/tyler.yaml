name: Tyler Gorthy
role: Branch President
section: branchPresidents
branch: stone-bridge
bio: >-
  Joining in 2026 as a senior at Stone Bridge High School, Tyler serves as the
  President of LNCP’s Stone Bridge Branch and is thrilled to work alongside the
  team to achieve their mission. Tyler is incredibly ambitious and dedicated to
  protecting Loudoun County’s natural spaces, a passion driven by his goal of
  becoming a civil/environmental engineer. His goals as Stone Bridge’s President
  aren’t only to lead cleanups and get his fellow students involved in restoring
  local habitats, but to inspire young minds and show them that our
  contributions can make a difference. He believes that a single conserved
  natural site may seem small, but it is a step closer to paving a path for a
  greener, healthier planet.
