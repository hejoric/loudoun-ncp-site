bio: >-
  Lucy Guilfoyle is a member of LNCP's team with a passion for environmental
  remediation, plastic pollution research, and ecological health. Through her
  research on microplastics and soil systems, she has developed a strong
  interest in how scientific understanding can inform efforts to protect and
  restore local ecosystems. Lucy hopes to expand LNCP's reach by bringing
  students and communities together around conservation, environmental
  education, and hands-on action. As she prepares for her next academic
  chapter, she looks forward to laying the groundwork for a future branch. She
  believes that meaningful environmental progress begins with curiosity, shared
  responsibility, and people willing to turn concern into action.
