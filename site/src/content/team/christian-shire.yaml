name: Christian Shire
role: Co-Founder & Advisor
section: executive
branch: potomac-falls
bio: >-
  With a background in environmental sciences, Christian Shire co-founded
  the Loudoun Nature Conservation Project to address the pressing
  environmental challenges facing our community. Growing up in Potomac
  Falls, he helped build LNCP to give back to the community that raised him.
  Christian now attends Arcadia University, where he continues to contribute
  to LNCP's research division and serves in a mentorship and advisory role.
