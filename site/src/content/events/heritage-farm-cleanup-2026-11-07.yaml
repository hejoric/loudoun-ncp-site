title: Heritage Farm Museum Cleanup
date: 2026-11-07
location: Heritage Farm Museum, 21668 Heritage Farm Ln, Sterling, VA 20164
description: >-
  Help keep the park clean at the Heritage Farm Museum. Volunteers of every
  experience level are welcome, including friends and family. We'll meet in
  front of the museum.


  Bring water, closed-toe shoes, and clothes you don't mind getting dirty. We
  provide gloves, trash bags, and vests. Bring your own gloves and trash bag to
  earn an extra half hour of service hours.


  Please arrive on time. We take attendance when we start and again when we
  finish, and you need to be on both to receive hours. If you have a school or
  organization hour form, bring it and we'll sign it at the end.


  Questions? Email Enzo Garcia-Eguiluz at enzo.ge@loudounnatureconservation.org
  or the directors at directors@loudounnatureconservation.org.
signupLink: https://www.signupgenius.com/go/20F0D45ADAF2EA2FDCE9-67072853-heritage#/
startTime: '11:00'
endTime: '13:00'
