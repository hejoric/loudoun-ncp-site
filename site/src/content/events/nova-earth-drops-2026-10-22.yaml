title: Earth Drops with our NOVA Branch
date: 2026-10-22
location: Northern Virginia Community College
description: >-
  Students from our NOVA branch planted earth drops, little balls of soil and
  seeds you toss onto bare ground to help it grow back. Thank you to everyone
  who stopped by!
